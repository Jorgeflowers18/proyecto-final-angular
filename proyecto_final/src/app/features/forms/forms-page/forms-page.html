<div class="forms-container">
  <div class="forms-header">
    <h1>Formularios</h1>
    <h3>Se crean formularios aplicando directivas de formularios reactivos</h3>
    <nav class="forms-nav">
      @for (option of formOptions; track option.path) {
        <a
          class="form-button"
          [routerLink]="option.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <span class="button-icon">{{ option.icon }}</span>
          <span class="button-label">{{ option.label }}</span>
        </a>
      }
    </nav>
  </div>

  <section class="forms-content">
    <router-outlet />
  </section>
</div>
