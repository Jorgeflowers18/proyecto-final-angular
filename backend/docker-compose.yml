services:
  postgres:
    image: postgres:16-alpine
    container_name: academic_management_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres-angular
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres-angular"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
